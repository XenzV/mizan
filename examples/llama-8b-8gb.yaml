base: llama-3.1-8b
task: sft
data:
  train: ./data/train.jsonl
  format: alpaca
training:
  epochs: 3
  lr: 2e-5
  batch_size: 2
  gradient_accumulation: 8
  seq_len: 512
  quantization: 4bit
  gradient_checkpointing: true
  lora:
    r: 16
    target_modules: [q, k, v, o, gate, up, down]
output: ./output
mizan:
  gpu_gib: 8
